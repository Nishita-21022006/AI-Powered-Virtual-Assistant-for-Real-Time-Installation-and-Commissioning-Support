- id: b025
  question: "How do I wipe the screen down without setting off a call?"
  expected_answer: "Press and hold the arrow circle button for 3 s to start cleaning mode. For 15 s the surface can be cleaned without any operating functions or calls being triggered; the remaining time is shown on the display. Press and hold the circle button to exit early."
  expected_source:
    document: "89475A3.GB0.pdf"
    section: "4 Operating menu"
    page: 26
  supporting_quote: "Pressing and holding (3s) the arrow circle button starts cleaning mode. During this period (15s), the surface can be cleaned without any operating functions or calls being triggered. The remaining time is shown on the display. Press and hold the circle button to exit cleaning mode early."
  category: step-sequence
  in_scope: true

