    section: "1.2 Separate cancel push-button for bed"
    page: 28
  supporting_quote: 'In the case of mixed operation of bed units SBU-M2 / M5 with bed units SBU D2 / DM2 +, the special parameter SF12 "Separate cancel push-button for bed" must not be set.'
