- id: b027
  question: "How many things can I hang off one DBUS line?"
  expected_answer: "Max. 4 DBUS components, of which max. 3 are of the same type, plus one further DBUS component of a different type."
  expected_source:
    document: "89470K2.GB0_V2.pdf"
    section: "4.5 Combinations in the patient room"
    page: 21
  supporting_quote: "In compliance with the restrictions for operation with the DBUS (max. 4 DBUS components, of which max. 3 are of the same type plus another DBUS component of a different type on a DBUS line), the rooms are separated from the individual areas of door, bed and bathroom / WC assembled."
  category: compatibility
  in_scope: true

